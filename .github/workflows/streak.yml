name: Daily GitHub Streak

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST every day
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows triggering manually from the Actions tab anytime

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Streak Log
        run: |
          mkdir -p docs
          echo "- **$(date '+%Y-%m-%d %H:%M:%S')**: Cloud automated daily streak update" >> docs/STREAK.md

      - name: Commit and push changes
        run: |
          git config --global user.name "sreethan05"
          git config --global user.email "sreethan05@users.noreply.github.com"
          git add docs/STREAK.md
          git commit -m "chore: daily streak update [$(date '+%Y-%m-%d')]"
          git push
