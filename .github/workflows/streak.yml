name: Daily Sync

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST every day
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update file
        run: |
          mkdir -p docs
          echo "Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > docs/updates.md

      - name: Commit and push changes
        run: |
          git config --global user.name "sreethan05"
          git config --global user.email "sreethan05@users.noreply.github.com"
          git add docs/updates.md
          git commit -m "updated file"
          git push
