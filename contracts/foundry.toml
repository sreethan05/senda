# senda escrow — Foundry project (TASK-301).
# Testnet-first (ADR-011): the default profile targets Monad testnet (10143).
# Mainnet deploys use `--profile mainnet`. Verified settings: docs/RESEARCH_TECH.md §4.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
eth_rpc_url = "https://testnet-rpc.monad.xyz"
chain_id = 10143
network = "monad"
bytecode_hash = "none"
use_literal_content = true

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad = "https://rpc.monad.xyz"

[invariant]
runs = 16
depth = 8

[profile.mainnet]
eth_rpc_url = "https://rpc.monad.xyz"
chain_id = 143
network = "monad"
bytecode_hash = "none"
use_literal_content = true

# Verification (TASK-304/305): Sourcify via Blockvision, no API key needed.
# forge verify-contract <ADDR> src/SendEscrow.sol:SendEscrow --chain 10143 \
#   --verifier sourcify --verifier-url https://sourcify-api-monad.blockvision.org/
# Deploy via keystore + forge script (never a raw key on the CLI):
# cast wallet import monad-deployer
# forge script script/Deploy.s.sol --rpc-url monad_testnet --broadcast
